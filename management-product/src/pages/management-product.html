<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<link href="../assets/fonts/HighVoltage Rough.woff2" rel="font/woff2">
	<link rel="stylesheet" href="../index.css">
	<title>Document</title>
</head>

<body>
	<div id="product-manager">
		<div class="container m-auto">
			<div class="modal-overlay"></div>
			<!-- Title page -->
			<h1 class="text-primary font-bold font-primary text-6xl mt-35">Management</h1>

			<!-- Add product button -->
			<div class="add-button-wrapper">
				<button class="btn-show-modal-form">
					<span class="add-button-text">Add product</span>
				</button>
			</div>

			<!-- Modal add new product -->
			<div class="upload-form-modal">
				<h2 class="title-modal">Add new product</h2>
				<button class="btn-close-modal" aria-label="Close">
					<img src="../assets/images/close-icon.svg" alt="Close" />
				</button>
				<form class="space-y-5">
					<div class="flex items-center space-x-6">
						<div class="image-product w-16 h-16 object-cover" aria-label="Add image">
							<img class="w-full h-full" src="../assets/images/avatar-icon.svg" alt="avatar" />
						</div>
						<label for="upload" class="form-modal-upload">
							<div class="flex flex-col items-center justify-center space-y-1">
								<div class="w-10 h-10">
									<img src="../assets/images/upload-icon.svg" alt="upload" />
								</div>
								<span class="form-modal-upload-text">Click to upload</span>
							</div>
							<input type="file" class="upload" />
						</label>
					</div>

					<div class="form-input-name">
						<label for="name">Name</label>
						<input type="text" class="name" placeholder="Enter name..." />
						<p class="error-message"></p>
					</div>

					<div class="form-input-quantity">
						<label for="quantity">Quantity</label>
						<input type="number" class="quantity" value="0" />
						<p class="error-message"></p>
					</div>

					<div class="form-input-price">
						<label for="price">Price</label>
						<input type="number" class="price" value="0" />
						<p class="error-message"></p>
					</div>

					<div class="product-status flex space-x-4">
						<div class="flex-1">
							<label for="status" class="block text-primary text-sm font-bold mb-1">Status</label>
							<div class="relative">
								<select class="status-product-select" aria-label="Select product status">
									<option>Available</option>
									<option>Sold out</option>
								</select>
								<div class="product-status-icon">
									<img src="../assets/images/chevron-down.svg"
										class="absolute right-3 top-1/2 transform -translate-y-1/2" />
								</div>
							</div>
							<p class="error-message"></p>
						</div>
						<div class="flex-1">
							<label for="types" class="block text-primary text-sm font-bold mb-1">Types</label>
							<div class="type-status relative">
								<select class="types-product-select" aria-label="Select product type">
									<option>Ring</option>
									<option>Bravo</option>
									<option>Alfa</option>
									<option>Gold</option>
								</select>
								<div class="product-status-icon">
									<img src="../assets/images/chevron-down.svg"
										class="absolute right-3 top-1/2 transform -translate-y-1/2" />
								</div>
							</div>
						</div>
					</div>

					<div class="form-input-brand">
						<label for="brand">Brand</label>
						<input type="text" class="brand" placeholder="Enter Brand..." />
						<p class="error-message"></p>
					</div>

					<div class="flex justify-end space-x-3 mt-4">
						<button class="btn-cancel" type="button">Cancel</button>
						<button class="btn-confirm" type="submit">Confirm</button>
					</div>
				</form>
			</div>

			<!-- Modal Delete product -->
			<div class="delete-modal max-[400xp]">
				<div class="delete-modal-content custom-shadow">
					<div class="delete-modal-header mb-6">
						<!-- Close icon top right -->
						<button class="btn-close-delete-modal">
							<img src="../assets/images/close-icon.svg" alt="close" class="w-6 h-6 cursor-pointer" />
						</button>

						<!-- Trash icon with pink glow circle -->
						<div class="trash-icon">
							<img src="../assets/images/trash-icon.svg" alt="trash" class="cursor-pointer" />
						</div>

						<!-- Text content -->
						<h2 class="text-primary font-bold text-lg mb-1.5">
							Delete product
						</h2>
						<p class="text-neutral text-sm">
							Are you sure you want to delete this product? This action cannot be
							undone.
						</p>
					</div>
					<!-- Buttons -->
					<div class="flex space-x-4">
						<button class="btn-cancel-deleteModal">
							Cancel
						</button>
						<button class="btn-confirm-deleteModal">
							Delete
						</button>
					</div>
				</div>
			</div>

			<!-- Modal Confirm product deletion -->
			<div class="confirm-modal-deletion custom-shadow">
				<div class="delete-modal-header mb-6">
					<!-- Close icon top right -->
					<button class="btn-close-delete-modal">
						<img src="../assets/images/close-icon.svg" alt="close" class="w-6 h-6 cursor-pointer" />
					</button>

					<!-- Trash icon with pink glow circle -->
					<div class="trash-icon">
						<img src="../assets/images/trash-icon.svg" alt="trash" class="cursor-pointer" />
					</div>

					<!-- Text content -->
					<h2 class="text-primary font-bold text-lg mb-1.5">
						Ooops!
					</h2>
					<p class="text-neutral text-sm">Something went wrong</p>
				</div>
				<button class="btn-close-confirm-modal">Close</button>
			</div>

			<!-- Table -->
			<div class="table-wrapper">
				<table class="product-table">
					<thead class="table-header">
						<tr class="table-row-header">
							<th>Product</th>
							<th>Status</th>
							<th>Type</th>
							<th>Quantity</th>
							<th>Brand</th>
							<th>Price</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody class="product-table-body">
						<!-- Product rows will be dynamically inserted here -->
					</tbody>
				</table>
			</div>
		</div>
		<script type="module" src="../scripts/management-product.js"></script>
</body>

</html>
